name: Quality

# Runs the gates on every push and PR. Before this existed the only automated
# check was preflight_release.py on `push: tags`, which fires after the tag has
# already been created -- a failure there means deleting and re-tagging. Catching
# the same problems here keeps the tag path clean.

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Static gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The game runs Lua 5.1, so the 5.1 compiler is the faithful check for
      # syntax errors and the 200-local / 60-upvalue chunk ceilings. Developer
      # machines often only have a newer luac, which accepts 5.2+ syntax the game
      # rejects; on CI we pin the real thing.
      # lua5.1 lives in universe and has been dropped from some newer archives,
      # so fall back rather than failing the run: check_lua_compile.py detects the
      # version, says which one it used, and covers the 5.2+ gap by scanning.
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 || sudo apt-get install -y lua5.4

      - name: Lua compiles + TOC integrity
        run: python scripts/check_lua_compile.py

      - name: Forward-reference audit
        run: python scripts/audit_lua_forward_refs.py

      - name: UI chrome bypass
        run: python scripts/check_ui_chrome_bypass.py

      - name: Locale quality
        run: python scripts/check_locale_quality.py

      - name: Module split wiring
        run: python scripts/check_split_wiring.py

      - name: Satellite bind
        run: python scripts/check_satellite_bind.py

      - name: Locale parity, version sync, changelog keys
        run: python .github/scripts/preflight_release.py

      # Behavioural gate: loads the shipped Modules/*.lua under a WoW API stub and fires
      # real events at them. Unlike the re-implementation-style test_*.lua scripts, a
      # regression in the shipped file fails here. Needs a real 5.1 VM, so it is skipped
      # when the Install Lua step fell back to 5.4.
      - name: Try Counter behaviour (real files under WoW stub)
        run: |
          if command -v lua5.1 >/dev/null 2>&1; then
            lua5.1 .github/scripts/test_try_counter_fishing.lua
            lua5.1 .github/scripts/test_try_counter_npc_loot.lua
            lua5.1 .github/scripts/test_addon_independence.lua
            lua5.1 .github/scripts/test_try_counter_selftest.lua
            lua5.1 .github/scripts/test_release_changelog.lua
            lua5.1 .github/scripts/test_try_counter_statistics.lua
            lua5.1 .github/scripts/test_try_counter_obtained_reconcile.lua
            lua5.1 .github/scripts/test_try_counter_core_regressions.lua
            lua5.1 .github/scripts/test_season_rollover.lua
          else
            echo "lua5.1 unavailable - skipping behavioural gate"
          fi

      # Save / login / logout persistence regressions: transient or teardown API reads and
      # reset-epoch jitter must never overwrite stored progress.
      - name: Persistence behaviour (real files under WoW stub)
        run: |
          if command -v lua5.1 >/dev/null 2>&1; then
            lua5.1 .github/scripts/test_week_stamp_jitter.lua
            lua5.1 .github/scripts/test_collection_store_logout.lua
            lua5.1 .github/scripts/test_item_level_event.lua
            lua5.1 .github/scripts/test_pve_weekly_flags.lua
            lua5.1 .github/scripts/test_profession_weekly_knowledge.lua
            lua5.1 .github/scripts/test_character_tracking_toggle.lua
            lua5.1 .github/scripts/test_character_delete_stale_copy.lua
            lua5.1 .github/scripts/test_rekey_week_stamps.lua
            lua5.1 .github/scripts/test_roster_dedup_guid_first.lua
            lua5.1 .github/scripts/test_guild_leave_recheck.lua
            lua5.1 .github/scripts/test_remove_plan_keeps_try_count.lua
            lua5.1 .github/scripts/test_account_wide_currency_value.lua
            lua5.1 .github/scripts/test_character_merge_gold.lua
            lua5.1 .github/scripts/test_full_character_save_keys.lua
            lua5.1 .github/scripts/test_reputation_warm_new_alt.lua
            lua5.1 .github/scripts/test_timer_handles.lua
            lua5.1 .github/scripts/test_vault_plan_progress.lua
            lua5.1 .github/scripts/test_pve_lockouts_login.lua
            lua5.1 .github/scripts/test_concentration_current_expansion.lua
          else
            echo "lua5.1 unavailable - skipping persistence gate"
          fi

      # API contract lints: multi-return positions, call shapes, struct fields and deprecated globals
      # checked against Blizzard_APIDocumentationGenerated 12.1.5 / warcraft.wiki.gg signatures.
      - name: API contract lints (static scan of shipped files)
        run: |
          if command -v lua5.1 >/dev/null 2>&1; then
            lua5.1 .github/scripts/test_api_return_positions.lua
            lua5.1 .github/scripts/test_api_call_shapes.lua
            lua5.1 .github/scripts/test_api_struct_fields.lua
            lua5.1 .github/scripts/test_deprecated_api_calls.lua
          else
            echo "lua5.1 unavailable - skipping API contract lints"
          fi

      # Features that called functions removed before 12.1.5: each test drives the documented
      # replacement through the shipped file and fails if the dead call comes back.
      - name: Removed-API replacements (real files under WoW stub)
        run: |
          if command -v lua5.1 >/dev/null 2>&1; then
            lua5.1 .github/scripts/test_crafting_order_counts.lua
            lua5.1 .github/scripts/test_hero_spec_name.lua
            lua5.1 .github/scripts/test_journal_search_restore.lua
          else
            echo "lua5.1 unavailable - skipping removed-API gate"
          fi
