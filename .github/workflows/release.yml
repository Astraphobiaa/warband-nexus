name: Release

# Two release lines, one CurseForge / Wago project:
#   vX.Y.Z          retail      .pkgmeta          WarbandNexus.toc        CHANGELOG.md
#   forever-vX.Y.Z  WoW Forever .pkgmeta-forever  WarbandNexus_Forever.toc CHANGELOG_FOREVER.md
# Each tag builds and uploads only its own zip, tagged only with its own game version.
on:
  push:
    tags:
      - "v*"
      - "forever-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Pre-release checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locale parity, version sync, changelog keys
        run: python .github/scripts/preflight_release.py

  release:
    name: Package and upload
    needs: preflight
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Flavor from the tag; game version from that flavor's TOC Interface (120105 -> 12.1.5,
      # 16001 -> 1.60.1), so the upload is tagged for that game only.
      - name: Select release flavor
        id: flavor
        run: |
          if [[ "${GITHUB_REF_NAME}" == forever-v* ]]; then
            flavor=forever; toc=WarbandNexus_Forever.toc; pkgargs="-m .pkgmeta-forever"
            # The packager validates the game version against WarbandNexus.toc (the package-as
            # name): in this CI checkout only, that file becomes the Forever TOC, so every TOC in
            # the Forever zip is a Forever one.
            cp WarbandNexus_Forever.toc WarbandNexus.toc
          else
            flavor=retail; toc=WarbandNexus.toc; pkgargs=""
          fi
          iface=$(grep -m1 '^## Interface:' "$toc" | sed 's/^## Interface:[[:space:]]*//; s/[[:space:]].*//; s/,.*//')
          iface="${iface//[^0-9]/}"
          gamever="$((iface / 10000)).$(((iface / 100) % 100)).$((iface % 100))"
          echo "flavor=$flavor" >> "$GITHUB_OUTPUT"
          echo "args=$pkgargs -g $gamever" >> "$GITHUB_OUTPUT"
          echo "Release flavor: $flavor ($toc, game version $gamever)"

      - name: Package and upload (CurseForge + Wago + GitHub Release)
        uses: BigWigsMods/packager@v2
        with:
          args: ${{ steps.flavor.outputs.args }}

      - name: Notify Discord (release bot)
        if: success()
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_RELEASE_CHANNEL_ID: ${{ secrets.DISCORD_RELEASE_CHANNEL_ID }}
          # "announcements" channel: changelog + store links + @everyone heads-up. Webhook of that
          # channel preferred; bot token + channel id also work.
          DISCORD_ANNOUNCEMENTS_WEBHOOK: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK }}
          DISCORD_ANNOUNCEMENTS_CHANNEL_ID: ${{ secrets.DISCORD_ANNOUNCEMENTS_CHANNEL_ID }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          WN_RELEASE_FLAVOR: ${{ steps.flavor.outputs.flavor }}
        # [no-announce] in the tag message or the tagged commit's message ships silently (no Discord).
        run: |
          # actions/checkout can leave an annotated tag as a lightweight one; refetch it.
          git fetch --force --quiet origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" || true
          if { git tag -l --format='%(contents)' "$GITHUB_REF_NAME"; git log -1 --format=%B; } | grep -qF '[no-announce]'; then
            echo "Tag $GITHUB_REF_NAME is marked [no-announce] - skipping Discord."
            exit 0
          fi
          python .github/scripts/post_discord_release.py
